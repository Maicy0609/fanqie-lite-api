[package]
name = "fqapi_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust core for fanqie-lite-api, ported from fqapp"
# Derivative of ch6vip/fqapp, which is GPL-3.0. See NOTICE.
license = "GPL-3.0-only"

[lib]
name = "fqapi_core"
# Upstream built cdylib/staticlib for the Android/desktop loaders. A server is a
# plain library; keeping the extra crate types would build artifacts nobody
# loads.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
flate2 = "1"
percent-encoding = "2"
once_cell = "1"
zeroize = { version = "1", features = ["derive"] }
regex = "1"
url = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tower = "0.5"
tower-http = { version = "0.6", default-features = false, features = ["fs", "set-header"] }
http-body-util = "0.1"
futures = "0.3"
log = "0.4"
